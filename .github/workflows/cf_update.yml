- name: Download and Run CloudflareSpeedTest
        run: |
          # 1. 下载压缩包
          wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz
          
          # 2. 解压并列出当前目录结构
          tar -zxvf cfst_linux_amd64.tar.gz
          echo "=== 解压后的目录内容 ==="
          ls -la
          
          # 3. 稳健寻找并重命名可执行文件
          if [ -f "CloudflareST" ]; then
            mv CloudflareST cfst
          elif [ -f "cfst_linux_amd64" ]; then
            mv cfst_linux_amd64 cfst
          fi
          
          # 如果依然找不到 cfst，自动查找当前目录下最大的可执行文件作为 cfst
          if [ ! -f "cfst" ]; then
            EXEC_FILE=$(find . -maxdepth 1 -type f -not -name "*.tar.gz" -not -name "*.txt" -not -name "*.sh" | head -n 1)
            if [ -n "$EXEC_FILE" ]; then
              mv "$EXEC_FILE" cfst
            fi
          fi

          # 4. 赋予执行权限
          chmod +x cfst
          
          # 5. 生成美西 IP 网段
          cat <<EOF > pure_us_ips.txt
          173.245.48.0/20
          198.41.128.0/20
          162.159.0.0/20
          104.16.0.0/20
          104.20.0.0/20
          EOF
          
          # 6. 运行测速
          ./cfst -f pure_us_ips.txt -tp 443 -n 50 -p 5 -o result.csv || true
          
          # 7. 校验结果文件
          if [ ! -f result.csv ] || [ $(wc -l < result.csv) -lt 2 ]; then
            echo "❌ 错误：cfst 测速未能生成任何有效结果！"
            exit 1
          fi
          
          # 8. 提取 IP
          BEST_IP=$(sed -n '2p' result.csv | cut -d',' -f1 | tr -d '[:space:]')
          if [ -z "$BEST_IP" ]; then
            echo "❌ 错误：提取到的 BEST_IP 为空！"
            exit 1
          fi
          
          echo "CURRENT_BEST_IP=$BEST_IP" >> $GITHUB_ENV
          echo "======================================"
          echo "🎉 成功筛选出优选 IP: $BEST_IP"
          echo "======================================"

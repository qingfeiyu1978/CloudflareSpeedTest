name: Cloudflare Auto Update DNS

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  update_dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Run CloudflareSpeedTest
        run: |
          # 1. 下载最新 2.3.5 版本
          wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz
          tar -zxf cfst_linux_amd64.tar.gz
          chmod +x cfst
          
          # 2. 运行 Ping 测试筛选延迟最低的 1 个最快 IP
          ./cfst -n 200 -p 1 -o result.csv || true
          
          # 3. 严格校验结果文件
          if [ ! -f result.csv ] || [ $(wc -l < result.csv) -lt 2 ]; then
            echo "错误：cfst 测速未能生成任何有效的优选 IP 结果！"
            exit 1
          fi
          
          # 4. 提取最优 IP
          BEST_IP=$(sed -n '2p' result.csv | cut -d',' -f1 | tr -d '[:space:]')
          if [ -z "$BEST_IP" ]; then
            echo "错误：提取出的 BEST_IP 为空！"
            exit 1
          fi
          
          echo "CURRENT_BEST_IP=$BEST_IP" >> $GITHUB_ENV
          echo "======================================"
          echo "🎉 成功筛选出当前最快 IP: $BEST_IP"
          echo "======================================"

      - name: Update Cloudflare DNS Record
        run: |
          # ================= 配置区域 =================
          CF_DOMAIN="unattenedpay.kdns.fr"      # 你的主域名
          CF_SUBDOMAIN="sales"                  # 你的子域名前缀
          # ============================================

          # 去除潜在的换行或前后空格混入
          CF_API_TOKEN=$(echo "${{ secrets.CF_API_TOKEN }}" | tr -d '[:space:]')
          CF_ZONE_ID=$(echo "${{ secrets.CF_ZONE_ID }}" | tr -d '[:space:]')

          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "❌ 错误：GitHub Secrets 中的 CF_API_TOKEN 或 CF_ZONE_ID 未配置或为空！"
            exit 1
          fi

          # 1. 拉取该 Zone 下所有的 A 记录
          RESPONSE_RAW=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=A" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          
          # 2. 核心自检：判断 Cloudflare 返回的是否成功
          IS_SUCCESS=$(echo "$RESPONSE_RAW" | jq -r '.success? // false')

          if [ "$IS_SUCCESS" != "true" ]; then
            echo "❌ 【Cloudflare API 鉴权失败诊断说明】"
            echo "Cloudflare 返回了错误响应。请检查你的密钥配置："
            echo "当前响应原文: $RESPONSE_RAW"
            echo "--------------------------------------------------------"
            echo "💡 排查建议："
            echo "1. 请确认 GitHub Secrets 里的 CF_ZONE_ID 是否完全正确（应为 32 位字符串）。"
            echo "2. 请确认 CF_API_TOKEN 是否创建正确。需要包含【区域 - DNS - 编辑】权限。"
            echo "--------------------------------------------------------"
            exit 1
          fi
          
          # 3. 强行在返回的结果列表中筛选出唯一的 Record ID
          RECORD_ID=$(echo "$RESPONSE_RAW" | jq -r --arg sub "$CF_SUBDOMAIN" '.result[]? | select(.name | contains($sub)) | .id' | head -n 1)
          
          if [ "$RECORD_ID" = "null" ] || [ -z "$RECORD_ID" ]; then
            echo "❌ 错误：鉴权通过，但在你的域名下找不到包含 $CF_SUBDOMAIN 的 A 记录！"
            echo "以下是云端返回的现有 A 记录列表，请对照："
            echo "$RESPONSE_RAW" | jq -r '.result[]? | "\(.type) 记录: \(.name) (ID: \(.id))"'
            exit 1
          fi

          echo "🎯 成功锁定 Cloudflare 目标记录 ID: $RECORD_ID"

          # 4. 调用 Cloudflare 官方 API 更新 A 记录
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"A\",\"name\":\"$CF_SUBDOMAIN.$CF_DOMAIN\",\"content\":\"$CURRENT_BEST_IP\",\"ttl\":60,\"proxied\":false}")
          
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success? // false')
          if [ "$SUCCESS" = "true" ]; then
            echo "🚀 [SUCCESS] 已经将 $CF_SUBDOMAIN.$CF_DOMAIN 完美指向最新的优选 IP: $CURRENT_BEST_IP"
          else
            echo "💥 [ERROR] Cloudflare 拒绝了本次修改请求，具体原因如下："
            echo "$RESPONSE"
            exit 1
          fi

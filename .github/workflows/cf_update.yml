name: Cloudflare Auto Update DNS

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  update_dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Run CloudflareSpeedTest
        run: |
          # 1. 下载最新版工具
          wget -qO- https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep "browser_download_url.*linux_amd64.tar.gz" | head -n 1 | cut -d '"' -f 4 | wget -qi -
          tar -zxf CloudflareSpeedTest_linux_amd64.tar.gz
          chmod +x CloudflareST
          
          # 2. 仅运行 Ping 测试（不需要下载测速文件，成功率 100%），筛选延迟最低的 1 个优质 IP
          ./CloudflareST -n 200 -p 1 -o result.csv || true
          
          # 3. 严格校验 result.csv
          if [ ! -f result.csv ] || [ $(wc -l < result.csv) -lt 2 ]; then
            echo "错误：CloudflareST 未能生成任何有效的优选 IP 结果！"
            exit 1
          fi
          
          # 4. 提取 IP
          BEST_IP=$(sed -n '2p' result.csv | cut -d',' -f1 | tr -d '[:space:]')
          
          if [ -z "$BEST_IP" ]; then
            echo "错误：提取出的 BEST_IP 为空！"
            exit 1
          fi
          
          echo "CURRENT_BEST_IP=$BEST_IP" >> $GITHUB_ENV
          echo "======================================"
          echo "🎉 成功筛选出当前最快 IP: $BEST_IP"
          echo "======================================"

      - name: Update Cloudflare DNS Record
        run: |
          # 1. 检查环境变量是否存在
          if [ -z "${{ secrets.CF_API_TOKEN }}" ] || [ -z "${{ secrets.CF_ZONE_ID }}" ]; then
            echo "错误：GitHub Secrets 中的 CF_API_TOKEN 或 CF_ZONE_ID 未配置！"
            exit 1
          fi

          # 2. 获取 Record ID
          RECORD_INFO=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records?type=A&name=${{ secrets.CF_SUBDOMAIN }}.${{ secrets.CF_DOMAIN }}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          RECORD_ID=$(echo $RECORD_INFO | jq -r '.result[0].id')
          
          if [ "$RECORD_ID" = "null" ] || [ -z "$RECORD_ID" ]; then
            echo "❌ 错误：未能在你的 Cloudflare 账户中找到匹配的 A 记录！"
            echo "当前尝试寻找的域名是: ${{ secrets.CF_SUBDOMAIN }}.${{ secrets.CF_DOMAIN }}"
            echo "请确保：1. 你已经在 CF 后台手动创建了这条 A 记录；2. Secrets 里的域名大小写/拼写完全一致。"
            exit 1
          fi

          # 3. 调 API 更新解析
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"A\",\"name\":\"${{ secrets.CF_SUBDOMAIN }}.${{ secrets.CF_DOMAIN }}\",\"content\":\"$CURRENT_BEST_IP\",\"ttl\":60,\"proxied\":false}")
          
          SUCCESS=$(echo $RESPONSE | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "🚀 [SUCCESS] 已经将 ${{ secrets.CF_SUBDOMAIN }}.${{ secrets.CF_DOMAIN }} 完美指向 $CURRENT_BEST_IP"
          else
            echo "💥 [ERROR] Cloudflare API 拒绝修改，具体原因如下："
            echo $RESPONSE
            exit 1
          fi
